name: Build and deploy Hexo

on:
  push:
    branches:
      - blogs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out blog source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install --yes pandoc

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run check

      - name: Keep repository maintenance configuration on main
        run: |
          mkdir -p public/.github
          cp .github/dependabot.yml public/.github/dependabot.yml

      - name: Publish generated site to main
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: ./public
          force_orphan: true
